<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué tanto me conoces?</title>
<style>
:root{--bg:#0e0e11;--card:#17171c;--line:#2a2a32;--text:#f2f2f5;--muted:#8d8d99;--ok:#3ecf8e;--bad:#ef5b5b;--acc:#c7c7ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{flex:1;width:100%;max-width:440px;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
footer{color:var(--muted);font-size:13px;padding:14px 0}
.screen{display:none}.screen.on{display:block}
h1{font-size:28px;font-weight:700;line-height:1.2;margin-bottom:8px}
h2{font-size:22px;margin:14px 0 16px}
p.sub{color:var(--muted);margin-bottom:24px;line-height:1.5}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;margin-bottom:12px;outline:none}
input:focus{border-color:var(--acc)}
.btn{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--text);color:#0e0e11;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);margin-top:10px}
.btn:disabled{opacity:.4}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:2px;transition:width .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;color:var(--text);cursor:pointer;text-align:center;font-size:14px;font-weight:500;display:flex;flex-direction:column;gap:8px}
.opt .im{width:100%;aspect-ratio:1/1;border-radius:10px;background:#202028;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:40px}
.opt img{width:100%;height:100%;object-fit:cover;display:block}
.opt span.t{min-height:34px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;min-height:22px;text-align:center;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
#next{margin-top:10px;display:none}
.score{font-size:64px;font-weight:800;text-align:center;margin:10px 0}
.shot{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;font-weight:600;margin-bottom:4px}.shot small{color:var(--muted);font-weight:400}
.msg{text-align:center;color:var(--muted);line-height:1.5;margin-bottom:24px}
</style>
</head>
<body>
<main>
  <section id="start" class="screen on">
    <h1>¿Qué tanto me conoces?</h1>
    <p class="sub">10 preguntas sobre mí. Escribe tu nombre y demuestra si de verdad me conoces.</p>
    <input id="name" type="text" placeholder="Tu nombre" maxlength="24" autocomplete="off">
    <button class="btn" id="go" disabled>Empezar Test</button>
  </section>

  <section id="quiz" class="screen">
    <div class="top"><span id="num"></span><span id="pts"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">Siguiente</button>
  </section>

  <section id="end" class="screen">
    <p class="sub" style="text-align:center;margin-bottom:0" id="who"></p>
    <div class="score" id="score"></div>
    <p class="msg" id="msg"></p>
    <div class="shot">📸 Toma captura y envíamela<br><small>(no hay dinero para servidores 😂😂✌️✌️)</small></div>
    <button class="btn ghost" id="again">Repetir test</button>
  </section>
</main>
<footer>Hecho por Héctor</footer>

<script>

    {t:"Breaking Bad", e:"🧪", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhkmVN6643imaDFhTFTsV2mpMDjhYfXFf6NnHVPFl5kQ&s=10"},

    {t:"Peso Pluma", e:"🎤", img:"https://i.scdn.co/image/ab67616100005174e5283f5b671cf618b82a2696"}]},
  {q:"Videojuego favorito", c:0, o:[
    {t:"Left 4 Dead 2", e:"🧟", img:"https://www.greenmangaming.com/blog/wp-content/uploads/2017/08/left4dead2_2_BlogBanner.jpg"},
    {t:"Call of Duty", e:"🔫", img:"https://store-images.s-microsoft.com/image/apps.30472.13966330883349940.9a0bbc3f-3231-4a17-ab16-55eb671f1755.d9aecc85-6637-4e56-a359-009944a02940"},

    {t:"Grand Theft Auto V", e:"🚗", img:"https://cdn1.epicgames.com/offer/b0cd075465c44f87be3b505ac04a2e46/EGS_GrandTheftAutoVEnhanced_RockstarNorth_S1_2560x1440-906d8ae76a91aafc60b1a54c23fab496"}]},

  {q:"Lugar al que me gustaría viajar", c:0, o:[

    {t:"Los Ángeles", e:"🌴", img:"https://www.disfrutalosangeles.com/f/estados-unidos/los-angeles/guia/los-angeles-m.jpg"}]},
  {q:"Álbum favorito de Bad Bunny", c:2, o:[
    {t:"x100pre", e:"💿", img:"https://i.scdn.co/image/ab67616d0000b273519266cd05491a5b5bc22d1e"},
    {t:"Las Que No Iban a Salir", e:"💿", img:"https://upload.wikimedia.org/wikipedia/commons/4/4d/Bad_Bunny_-_Las_Que_No_Iban_a_Salir.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original"},
    {t:"El Último Tour Del Mundo", e:"💿", img:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRtSEVzkTVSrAuGl2rOM1chz1xD6wkWLBNtGITzi5CiB2ER9_FMbRcNLbM&s=10"},
    {t:"Un Verano Sin Ti", e:"💿", img:"https://i.scdn.co/image/ab67706f0000000295c94a38840f54b062b8739d"}]}
];

const $ = id => document.getElementById(id);
let name = "", i = 0, score = 0, locked = false;

function show(id){ document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); }

$("name").addEventListener("input", e => { $("go").disabled = !e.target.value.trim(); });
$("go").onclick = () => { name = $("name").value.trim(); i = 0; score = 0; show("quiz"); render(); };

function render(){
  const d = DATA[i]; locked = false;
  $("num").textContent = "Pregunta " + (i+1) + " de " + DATA.length;
  $("pts").textContent = "Aciertos: " + score;
  $("prog").style.width = (i / DATA.length * 100) + "%";
  $("q").textContent = d.q;
  $("fb").textContent = ""; $("fb").className = "fb";
  $("next").style.display = "none";
  $("next").textContent = i === DATA.length - 1 ? "Ver resultado" : "Siguiente";
  const box = $("opts"); box.innerHTML = "";
  d.o.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    const im = document.createElement("div"); im.className = "im"; im.textContent = o.e;
    if (o.img){
      const img = document.createElement("img");
      img.alt = o.t;
      img.loading = "lazy";
      img.src = o.img;
      img.onerror = () => { im.textContent = o.e; };
      im.textContent = "";
      im.appendChild(img);
    }
    const t = document.createElement("span"); t.className = "t"; t.textContent = o.t;
    b.append(im, t);
    b.onclick = () => answer(k, b);
    box.appendChild(b);
  });
}

function answer(k, btn){
  if (locked) return; locked = true;
  const d = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[d.c].classList.add("ok");
  if (k === d.c){ score++; $("fb").textContent = "¡Correcto!"; $("fb").className = "fb ok"; }
  else { btn.classList.add("bad"); $("fb").textContent = "Fallaste. La respuesta era: " + d.o[d.c].t; $("fb").className = "fb bad"; }
  $("pts").textContent = "Aciertos: " + score;
  $("next").style.display = "block";
}

$("next").onclick = () => { i++; i < DATA.length ? render() : finish(); };

function finish(){
  show("end");
  $("who").textContent = name + ", tu resultado:";
  $("score").textContent = score + "/" + DATA.length;
  let m;
  if (score <= 3) m = name + ", casi no me conoces… ¡pero aún estás a tiempo de conocerme mejor!";
  else if (score <= 6) m = "Nada mal, " + name + ". Me conoces algo, pero todavía te faltan detalles.";
  else if (score <= 9) m = "¡Muy bien, " + name + "! Me conoces bastante. Casi perfecto.";
  else m = "¡" + name + ", eres mi mejor amigo! Me conoces al 100%.";
  $("msg").textContent = m;
}

$("again").onclick = () => { $("name").value = ""; $("go").disabled = true; show("start"); };
</script>
</body>
</html>
